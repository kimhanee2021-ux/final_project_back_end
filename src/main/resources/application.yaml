server:
  port: 8080
spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  application:
    name: final_project_back_end
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: true
    hibernate:
      # update는 기존 테이블/데이터를 지우지 않고 없는 것만 추가한다
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

#스웨거 UI URL 설정
springdoc:
  swagger-ui:
    path: /swagger-ui.html

#JWT 토큰 비밀키 및 만료시간 설정
#-비밀 키는 32자(256bit) 이상이어야 한다 (짧으면 앱 시작 시 JwtService에서 예외 발생)
jwt:
  secret-key: ${JWT_SECRET_KEY}
  expiration-ms: 3600000 #엑세스 토큰 유효시간(1시간)

#스팀 Web API 키 (보유 게임 목록 조회에 사용)
steam:
  api-key: ${STEAM_API_KEY}

#CORS 허용 대상 프론트엔드 주소 (값이 없으면 vite 기본 포트 사용)
app:
  ai:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-flash-latest}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  #games 테이블 CSV 시드 (임시용, 최초 1회만 true로 켜서 사용. games 테이블에 데이터가 있으면 자동으로 스킵됨)
  seed:
    games:
      enabled: ${SEED_GAMES_ENABLED:true}
      chunk-size: ${SEED_GAMES_CHUNK_SIZE:500}

board:
  images:
    directory: ${BOARD_IMAGE_DIRECTORY:./uploads/board}
