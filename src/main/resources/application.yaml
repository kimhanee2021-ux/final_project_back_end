server:
  port: 8080
spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  application:
    name: final_project_back_end
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: true
    hibernate:
      # update는 기존 테이블/데이터를 지우지 않고 없는 것만 추가한다
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

#스웨거 UI URL 설정
springdoc:
  swagger-ui:
    path: /swagger-ui.html

#JWT 토큰 비밀키 및 만료시간 설정
#-비밀 키는 32자(256bit) 이상이어야 한다 (짧으면 앱 시작 시 JwtService에서 예외 발생)
jwt:
  secret-key: ${JWT_SECRET_KEY}
  expiration-ms: 3600000 #엑세스 토큰 유효시간(1시간)

#스팀 Web API 키 (보유 게임 목록 조회에 사용)
steam:
  api-key: ${STEAM_API_KEY}

#CORS 허용 대상 프론트엔드 주소 (값이 없으면 vite 기본 포트 사용)
app:
  rank:
    # 조회는 항상 제공하며, 저장과 정기 수집은 명시적으로 켠 경우에만 실행한다.
    sync-enabled: ${RANK_SYNC_ENABLED:false}
    schedule-enabled: ${RANK_SCHEDULE_ENABLED:false}
    sync-cron: ${RANK_SYNC_CRON:0 0 6 * * *}
  ai:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-flash-latest}
    pc:
      model: ${GEMINI_PC_MODEL:gemini-3.5-flash-lite}
      provider: ${PC_AI_PROVIDER:auto}
      groq-api-key: ${GROQ_API_KEY:}
      groq-model: ${GROQ_PC_MODEL:qwen/qwen3.8-27b}
      groq-min-interval-seconds: ${GROQ_PC_MIN_INTERVAL_SECONDS:0}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  #games 테이블 CSV 시드 (임시용, 최초 1회만 true로 켜서 사용. games 테이블에 데이터가 있으면 자동으로 스킵됨)
  seed:
    games:
      enabled: ${SEED_GAMES_ENABLED:true}
      chunk-size: ${SEED_GAMES_CHUNK_SIZE:2000}
      writer-threads: ${SEED_GAMES_WRITER_THREADS:4}
    #(선택, 개발용) games 전체의 원화 가격 미리 받기. 보유 게임 가격은 소비 분석 조회 때 자동으로 채워지므로 기본 false
    prices:
      enabled: ${SEED_PRICES_ENABLED:false}
  #(개발용) games의 할인가 표시/할인율을 스팀 IStoreBrowseService/GetItems로 매일 갱신. 기본 false(비활성)
  price-sync:
    enabled: ${PRICE_SYNC_ENABLED:false}
    cron: ${PRICE_SYNC_CRON:0 30 3 * * *}
    request-interval-ms: ${PRICE_SYNC_REQUEST_INTERVAL_MS:500}
  #AI 게임 소비 코치(Gemini). 키는 .env의 GEMINI_API_KEY만 사용 (AI 팀원 기능과 같은 키, 설정 이름은 따로)
  coach:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_COACH_MODEL:gemini-3.5-flash-lite}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
  #스팀 featured/featuredcategories 캐시를 매일 다시 받는 시각 (기본: 매일 새벽 4시 10분, KST)
  featured:
    sync-cron: ${FEATURED_SYNC_CRON:0 10 4 * * *}
    #서버 기동 시에도 바로 한 번 받아 둘지 여부 (개발 환경에서 새벽 스케줄까지 기다리지 않고 바로 확인하고 싶을 때)
    sync-on-startup: ${FEATURED_SYNC_ON_STARTUP:true}

board:
  images:
    directory: ${BOARD_IMAGE_DIRECTORY:./uploads/board}
