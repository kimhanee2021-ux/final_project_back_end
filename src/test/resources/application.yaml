spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:gamesense-tests;MODE=MySQL;DB_CLOSE_DELAY=-1;IGNORECASE=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
jwt:
  secret-key: board-api-tests-only-key-at-least-32-bytes-long
  expiration-ms: 3600000
steam:
  api-key: unused-test-key
app:
  frontend-base-url: http://localhost:9191
