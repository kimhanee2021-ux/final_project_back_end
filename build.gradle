plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.ict'
version = '0.0.1-SNAPSHOT'
description = 'final_project_back_end'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2:2.3.232'
    testAnnotationProcessor 'org.projectlombok:lombok'
    /*JWT 토큰 라이브러리*/
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
    /* 환경 변수 관리용 dotenv-java 라이브러리*/
    implementation 'io.github.cdimascio:dotenv-java:3.0.0'
    /* 구글/카카오 소셜로그인(OAuth2 Client) 라이브러리 */
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    /* games 시드용 CSV 파싱 라이브러리 (따옴표로 감싸인 콤마/개행 포함 필드를 안전하게 처리) */
    implementation 'com.opencsv:opencsv:5.9'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Explicit, limited news collection; kept out of the web application's startup and bootJar.
sourceSets {
    newsCollector {
        java.srcDir 'scripts/game-news/java'
        compileClasspath += sourceSets.main.output + configurations.runtimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

tasks.register('collectGameNews', JavaExec) {
    group = 'application'
    description = 'Collect official Steam news for existing games (-PnewsAppIds=570,730 -PnewsCount=5)'
    classpath = sourceSets.newsCollector.runtimeClasspath
    mainClass = 'org.ict.tools.gamenews.GameNewsCollectCommand'
    def newsAppIds = providers.gradleProperty('newsAppIds')
    def newsCount = providers.gradleProperty('newsCount').orElse('20')
    doFirst {
        if (!newsAppIds.isPresent()) {
            throw new GradleException('Specify -PnewsAppIds=570,730 (1-20 existing games)')
        }
        args = [newsAppIds.get(), newsCount.get()]
    }
}

['briefGameNews': 'brief', 'syncGameNews': 'sync'].each { taskName, mode ->
    tasks.register(taskName, JavaExec) {
        group = 'application'
        description = 'Generate Korean briefings for stored news; sync also collects Steam news first'
        classpath = sourceSets.newsCollector.runtimeClasspath
        mainClass = 'org.ict.tools.gamenews.GameNewsBriefCommand'
        def newsAppIds = providers.gradleProperty('newsAppIds')
        def newsCount = providers.gradleProperty('newsCount').orElse('20')
        doFirst {
            if (!newsAppIds.isPresent()) throw new GradleException('Specify -PnewsAppIds=570,730 (1-20 existing games)')
            args = [mode, newsAppIds.get(), newsCount.get()]
        }
    }
}

tasks.register('verifyGameNewsApi', JavaExec) {
    group = 'verification'
    description = 'Read-only HTTP checks against stored briefings (-PnewsAppIds=570,730,440)'
    classpath = sourceSets.newsCollector.runtimeClasspath
    mainClass = 'org.ict.tools.gamenews.GameNewsApiVerifyCommand'
    def newsAppIds = providers.gradleProperty('newsAppIds')
    doFirst {
        if (!newsAppIds.isPresent()) throw new GradleException('Specify -PnewsAppIds=570,730,440')
        args = [newsAppIds.get()]
    }
}

tasks.register('verifyGameNewsSchedule', JavaExec) {
    group = 'verification'
    description = 'Make selected games due and verify two real scheduled collection/briefing cycles'
    classpath = sourceSets.newsCollector.runtimeClasspath
    mainClass = 'org.ict.tools.gamenews.GameNewsScheduleVerifyCommand'
    def newsAppIds = providers.gradleProperty('newsAppIds')
    doFirst {
        if (!newsAppIds.isPresent()) throw new GradleException('Specify -PnewsAppIds=570,730,440')
        args = [newsAppIds.get()]
    }
}
